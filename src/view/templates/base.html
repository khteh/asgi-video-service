<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STEM Video Explainer{% endblock %}</title>
  <link rel="icon" href="{{ url_for('web.static', filename='images/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('web.static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('web.index') }}">
      <img src="{{ url_for('web.static', filename='images/logo.png') }}" alt="" class="brand-logo">
      <span>STEM Explainer</span>
    </a>
    <nav>
      <a href="{{ url_for('web.index') }}">New Video</a>
      <a href="{{ url_for('web.jobs_list') }}">My Videos</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Every video: 90s max &middot; 4K &middot; 60fps</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
